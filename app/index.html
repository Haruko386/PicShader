<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <title>映框</title><link rel="stylesheet" href="style.css">
  <script defer src="vendor/exifr-lite.js"></script><script defer src="render.js"></script><script defer src="studio.js"></script>
</head>
<body>
  <svg class="defs" aria-hidden="true"><defs>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M4 5h12l-4 4H8v5l-4 4zm16 14H8l4-4h4v-5l4-4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 18V6h7l2 2h7v3M3 19l3-8h15l-3 8z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 7h6m5 0h5M4 17h10m5 0h1"/><circle cx="12.5" cy="7" r="2.5"/><circle cx="16.5" cy="17" r="2.5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 8h10v7H7z"/></symbol>
    <symbol id="i-ratio" viewBox="0 0 24 24"><path d="M7 3v14h14M3 7h14v14"/></symbol>
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M3 5h10l8 8-8 8-10-10z"/><circle cx="8" cy="9" r="1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 15h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-contain" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="1.5"/><rect x="7.5" y="6.5" width="9" height="11" rx=".5"/></symbol>
    <symbol id="i-cover" viewBox="0 0 24 24"><path d="M3 9V4h5m8 0h5v5m0 6v5h-5M8 20H3v-5M7 15l4-5 3 3 3-4"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-dark" viewBox="0 0 24 24"><path d="M20 14a8.7 8.7 0 0 1-10-11A9 9 0 1 0 20 14z"/></symbol>
    <symbol id="i-none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m6 18 12-12"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2m-8-2v14m-4 0h8"/></symbol>
    <symbol id="i-length" viewBox="0 0 24 24"><path d="M3 7v10m18-10v10M5 12h14m-11-3-3 3 3 3m8-6 3 3-3 3"/></symbol>
  </defs></svg>
  <header>
    <span class="mark" title="映框" role="img" aria-label="映框"><svg aria-hidden="true"><use href="#i-mark"/></svg></span>
    <div class="source"><strong id="file-name"></strong><span id="file-info"></span></div>
    <nav aria-label="照片操作">
      <button id="folder" title="添加文件夹" aria-label="添加文件夹"><svg aria-hidden="true"><use href="#i-open"/></svg></button>
      <button id="theme" aria-label="切换主题"><svg aria-hidden="true"><use href="#i-system"/></svg></button>
      <button id="edit" disabled title="照片参数" aria-label="照片参数" ><svg aria-hidden="true"><use href="#i-edit"/></svg></button>
      <button id="open" title="打开照片 (Ctrl+O)" aria-label="打开照片 (Ctrl+O)" ><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
    </nav>
  </header>
  <main>
    <div class="stage" id="stage"><div id="viewport"><button id="empty" title="添加照片" aria-label="添加照片"><svg aria-hidden="true"><use href="#i-plus"/></svg></button><canvas hidden id="preview" aria-label="边框实时预览"></canvas></div><div class="drop-hint"><svg aria-hidden="true"><use href="#i-open"/></svg></div></div>
    <aside aria-label="边框设置">
      <select hidden id="queue" title="切换照片" aria-label="已添加的照片"></select>
      <div class="controls">
        <section aria-label="边框样式"><span class="group-icon" title="边框样式"><svg aria-hidden="true"><use href="#i-frame"/></svg></span><div class="group-body"><div id="styles"><button data-style="white" title="经典白框" aria-label="经典白框" aria-pressed="true"><span class="thumb white"><i></i></span></button><button data-style="blur" title="背景虚化" aria-label="背景虚化" aria-pressed="false"><span class="thumb blur"><i></i></span></button></div></div></section>
        <section aria-label="画布比例与适配"><span class="group-icon" title="画布比例与适配"><svg aria-hidden="true"><use href="#i-ratio"/></svg></span><div class="group-body"><div id="ratios"></div><div id="custom" hidden><input id="rw" title="宽" aria-label="宽" type="number" min="1" max="10000" value="5">:<input id="rh" title="高" aria-label="高" type="number" min="1" max="10000" value="4"></div><div id="fit" role="group" aria-label="照片适配"><button id="contain" title="完整保留" aria-label="完整保留" aria-pressed="true"><svg aria-hidden="true"><use href="#i-contain"/></svg></button><button id="cover" title="居中裁切" aria-label="居中裁切" aria-pressed="false"><svg aria-hidden="true"><use href="#i-cover"/></svg></button></div></div></section>
        <section aria-label="品牌标识"><span class="group-icon" title="品牌标识"><svg aria-hidden="true"><use href="#i-brand"/></svg></span><div class="group-body"><div id="variant" class="logo-strip variants" role="group" aria-label="标识样式"></div><div id="brand" class="logo-strip" role="group" aria-label="品牌"></div></div></section>
        <section aria-label="导出设置"><span class="group-icon" title="导出设置"><svg aria-hidden="true"><use href="#i-file"/></svg></span><div class="group-body"><div class="pair"><select id="format" title="文件格式" aria-label="文件格式"><option>JPEG</option><option>PNG</option></select><label class="size-control"><span id="size-face" aria-hidden="true"><svg><use href="#i-length"/></svg></span><select id="size" title="长边尺寸" aria-label="长边尺寸"><option value="0">原长边</option><option value="2048">2048 px</option><option value="3840">3840 px</option><option value="6000">6000 px</option></select></label></div></div></section>
      </div>
      <footer><output id="output" aria-label="导出尺寸"></output><button id="export" title="导出照片" aria-label="导出照片" disabled><svg aria-hidden="true"><use href="#i-save"/></svg></button></footer>
    </aside>
  </main>
  <input type="file" id="picker" multiple  hidden>
  <input type="file" id="directory" webkitdirectory multiple hidden>
  <dialog id="editor" aria-labelledby="meta-title"><form method="dialog">
    <div class="dialog-head"><h2 id="meta-title">照片参数</h2><button id="cancel" title="取消" aria-label="取消" type="button"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <p id="meta-note"></p><div id="fields"></div>
    <div class="dialog-actions"><button id="apply" title="应用" aria-label="应用" value="apply" class="primary"><svg aria-hidden="true"><use href="#i-check"/></svg></button></div>
  </form></dialog><div id="toast" role="status"></div>
</body>
</html>
